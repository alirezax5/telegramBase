name: tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  offline-tests:
    name: PHP ${{ matrix.php }} offline tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, bcmath, iconv
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Composer audit
        run: composer audit --no-dev

      - name: Syntax check
        run: |
          set -e
          find App tests Plugin -name '*.php' -exec php -l {} \; 2>&1 | tee /tmp/lint.log
          if grep -q "Parse error\|Fatal error\|No syntax errors detected" /tmp/lint.log; then
            grep -v "No syntax errors detected" /tmp/lint.log | grep -q . && exit 1 || exit 0
          fi

      - name: Smoke test
        run: php tests/smoke.php

      - name: Offline test suite
        run: php tests/run.php

      - name: Doctor (no token)
        env:
          TGBASE_SKIP_BOT_VALIDATION: 1
        run: php bin/tgbase doctor
